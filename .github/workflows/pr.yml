name: PR Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && steps.lint_pr_title.outputs.error_message != ''
        with:
          header: pr-title-lint-error
          message: |
            👋🏼 Thanks for your contribution!

            To keep our commit history consistent and easy to understand, please ensure your PR title follows the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) specification.

            **Details:**

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      - if: always() && steps.lint_pr_title.outputs.error_message == ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-lint-error
          delete: true
