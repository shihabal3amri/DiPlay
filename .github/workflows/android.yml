name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Restore Robolectric Android jars
        id: robolectric-sdks
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-sdks-${{ hashFiles('gradle/robolectric-sdks.sha512') }}
      - name: Check Robolectric Android jars and download missing ones
        timeout-minutes: 10
        run: python3 scripts/fetch_robolectric_sdks.py
      # Pull requests read the cache from main. A copy for each pull request would fill the cache quota.
      - name: Save Robolectric Android jars
        if: github.event_name != 'pull_request' && steps.robolectric-sdks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ steps.robolectric-sdks.outputs.cache-primary-key }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Report Robolectric jars that are not in the list
        if: always()
        run: python3 scripts/fetch_robolectric_sdks.py --report-unlisted
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
