name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke-test-api27:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: diplay-app-debug
          path: app/build/outputs/apk/debug/

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-27-google_apis-x86_64

      - name: Create AVD and generate cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: x86_64
          profile: 10.1in WXGA (Tablet)
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for API 27"

      - name: Smoke test on Android 8.1 / API 27 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: x86_64
          profile: 10.1in WXGA (Tablet)
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p diagnostics-api27
            trap '
              adb logcat -d > diagnostics-api27/logcat.txt 2>&1 || true
              adb shell dumpsys activity top > diagnostics-api27/activity-top.txt 2>&1 || true
              adb shell dumpsys window windows > diagnostics-api27/window-hierarchy.txt 2>&1 || true
              adb exec-out screencap -p > diagnostics-api27/screenshot.png 2>/dev/null || true
            ' EXIT

            echo "=== Installing debug APK on API 27 emulator ==="
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk

            echo "=== Granting runtime permissions ==="
            adb shell pm grant com.shihab.diplay android.permission.RECORD_AUDIO || true
            adb shell pm grant com.shihab.diplay android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.shihab.diplay android.permission.ACCESS_COARSE_LOCATION || true
            adb shell dumpsys package com.shihab.diplay | grep -A 20 "runtime permissions:" > diagnostics-api27/permissions.txt || true

            echo "=== Clearing logcat and launching DiPlayActivity ==="
            adb logcat -c
            adb shell am start -n com.shihab.diplay/com.shilapi.xcertplay.DiPlayActivity
            sleep 8

            echo "=== Checking activity focus ==="
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp"

            echo "=== Checking for FATAL EXCEPTION in logcat ==="
            if adb logcat -d | grep -E "FATAL EXCEPTION|ClassNotFoundException|NoClassDefFoundError"; then
              echo "Crash or missing class detected on API 27!"
              exit 1
            fi
            echo "API 27 smoke test passed without fatal crashes."

      - name: Save API 27 Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api27-emulator-diagnostics
          path: diagnostics-api27/
          if-no-files-found: ignore

  release-build:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ] && \
             [ -n "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release signing: missing required GitHub repository secrets."
          fi

      - uses: actions/setup-java@v5
        if: steps.check-secrets.outputs.has_secrets == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.check-secrets.outputs.has_secrets == 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check-secrets.outputs.has_secrets == 'true'

      - name: Make gradlew executable
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: chmod +x gradlew

      - name: Prepare release keystore
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
          chmod 600 release.keystore
          keytool -list -keystore release.keystore -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" -alias "${{ secrets.RELEASE_KEY_ALIAS }}"

      - name: Build and sign release APK
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diplay-app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
