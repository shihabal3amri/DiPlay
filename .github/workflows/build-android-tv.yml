name: Build GeelyPlay source APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build without authentication assets
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GeelyPlay-source-only
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish APK to the tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          apk="GeelyPlay-${tag}.apk"
          checksum="${apk}.sha256"
          cp mobile/build/outputs/apk/debug/mobile-debug.apk "$apk"
          shasum -a 256 "$apk" > "$checksum"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$checksum" \
              --title "GeelyPlay ${GITHUB_REF_NAME}" \
              --notes "Automated source-only APK build. This package does not include offline MFi authentication assets."
          fi
